<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map Measure</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed map canvas, compact tool sheet docked to the bottom (thumb reach). */
:root {
  --ground: #e9ecef;
  --sheet: #ffffff;
  --ink: #1b2129;
  --muted: #5d6874;
  --line: #d3d9df;
  --bench: #1f4fd1;   /* benchmark: survey-ink blue */
  --route: #0b8f7f;   /* route: teal, clear of the map's magenta/orange marks */
  --danger: #b4232f;
  --canvas-bg: #c9cfd5;
  --f-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #12161b; --sheet: #1b2128; --ink: #e8edf2; --muted: #95a1ad;
    --line: #2d3540; --bench: #7d9dff; --route: #3fd0bc; --danger: #ff7a84; --canvas-bg: #0d1014;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #12161b; --sheet: #1b2128; --ink: #e8edf2; --muted: #95a1ad;
  --line: #2d3540; --bench: #7d9dff; --route: #3fd0bc; --danger: #ff7a84; --canvas-bg: #0d1014;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--ground); color: var(--ink); font-family: var(--f-ui); font-size: 15px;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
  overflow: hidden; overscroll-behavior: none;
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
header {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: var(--sheet); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .01em; flex: 1; }
.scale-chip {
  font-family: var(--f-num); font-size: 12px; padding: 4px 8px; border-radius: 4px;
  border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
}
.scale-chip.set { color: var(--bench); border-color: var(--bench); }

#stage { position: relative; min-height: 0; min-width: 0; background: var(--canvas-bg); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#loupe {
  position: absolute; top: 12px; left: 12px; width: 132px; height: 132px; border-radius: 50%;
  border: 3px solid var(--sheet); box-shadow: 0 4px 16px rgba(0,0,0,.35); pointer-events: none;
}
#loupe.right { left: auto; right: 12px; }
.hint {
  position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
  background: rgba(20,24,30,.78); color: #fff; font-size: 13px; padding: 6px 12px; border-radius: 20px;
  white-space: nowrap; pointer-events: none; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
.zoom { position: absolute; right: 12px; bottom: 48px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 40px; height: 40px; font-size: 20px; padding: 0; }

.sheet {
  background: var(--sheet); border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: transparent; color: var(--muted); font-weight: 500; height: 40px; }
.tabs button[aria-pressed="true"][data-mode="bench"] { background: var(--bench); color: var(--sheet); }
.tabs button[aria-pressed="true"][data-mode="route"] { background: var(--route); color: var(--sheet); }

.readout { display: flex; align-items: baseline; gap: 10px; min-height: 40px; }
.readout .big { font-family: var(--f-num); font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
.readout .sub { color: var(--muted); font-size: 13px; }
body[data-mode="bench"] .readout .big { color: var(--bench); }
body[data-mode="route"] .readout .big { color: var(--route); }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; min-width: 120px; }
button, .filebtn {
  font: inherit; font-weight: 500; height: 42px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--sheet); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, .filebtn:focus-within { outline: 2px solid var(--bench); outline-offset: 2px; }
button.primary { border: 0; color: var(--sheet); }
body[data-mode="bench"] button.primary { background: var(--bench); }
body[data-mode="route"] button.primary { background: var(--route); }
.filebtn { height: 34px; font-size: 14px; position: relative; overflow: hidden; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.field { position: relative; }
.field input {
  width: 100%; height: 42px; box-sizing: border-box; padding: 0 34px 0 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--ground); color: var(--ink);
  font-family: var(--f-num); font-size: 18px;
}
.field span { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-family: var(--f-num); }

.saved { display: flex; flex-direction: column; gap: 4px; max-height: 22vh; overflow-y: auto; }
.saved:empty { display: none; }
.saved .item {
  display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
  padding: 6px 0; border-top: 1px solid var(--line);
}
.saved .item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved .item .len { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--route); }
.saved .item button { height: 32px; padding: 0 10px; font-size: 13px; }
.saved .item.active .name { font-weight: 600; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
[hidden] { display: none !important; }
@media (min-width: 760px) {
  body { grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); }
  header { grid-column: 1 / -1; }
  .sheet { border-top: 0; border-left: 1px solid var(--line); overflow-y: auto; }
  .saved { max-height: none; }
}
</style>
</head>
<body>

<header>
  <h1>Map Measure</h1>
  <span class="scale-chip" id="scaleChip">no benchmark</span>
  <label class="filebtn" for="file">Photo<input type="file" id="file" accept="image/*"></label>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <canvas id="loupe" width="264" height="264" hidden></canvas>
  <div class="zoom">
    <button id="zin" aria-label="Zoom in">+</button>
    <button id="zout" aria-label="Zoom out">−</button>
    <button id="zfit" aria-label="Fit map" style="font-size:13px">fit</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<section class="sheet">
  <div class="tabs" role="group" aria-label="Mode">
    <button data-mode="bench" id="tabBench">1 · Benchmark</button>
    <button data-mode="route" id="tabRoute">2 · Route</button>
  </div>

  <div class="readout">
    <span class="big" id="big">—</span>
    <span class="sub" id="sub"></span>
  </div>

  <div class="row" id="benchControls">
    <div class="field grow"><input id="benchLen" type="number" inputmode="decimal" min="0" step="any" placeholder="Known length"><span>m</span></div>
    <button class="primary" id="saveBench">Save benchmark</button>
  </div>

  <div class="row" id="routeControls">
    <input id="routeName" class="grow" type="text" placeholder="Route name, e.g. 966 → 544"
      style="height:42px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);font:inherit;box-sizing:border-box">
    <button class="primary" id="saveRoute">Save</button>
  </div>

  <div class="row">
    <button id="undo" class="grow">Undo point</button>
    <button id="clear" class="grow">Clear</button>
    <button id="newRoute" class="grow">New route</button>
  </div>

  <div id="savedWrap">
    <div class="label" id="savedLabel" hidden>Saved routes</div>
    <div class="saved" id="saved"></div>
  </div>
</section>

const $ = id => document.getElementById(id);

/* ---------- storage (device-only) ---------- */
const LS_KEY = "mapmeasure.state.v1";
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadState() {
  try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open("mapmeasure", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("img");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function putImage(blob) {
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const tx = db.transaction("img", "readwrite");
      tx.objectStore("img").put(blob, "current");
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e) {}
}
async function getImage() {
  try {
    const db = await idb();
    return await new Promise((res) => {
      const r = db.transaction("img").objectStore("img").get("current");
      r.onsuccess = () => res(r.result || null); r.onerror = () => res(null);
    });
  } catch (e) { return null; }
}

/* ---------- geometry ---------- */
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const polyLen = pts => pts.reduce((s, p, i) => i ? s + dist(pts[i - 1], p) : 0, 0);
function metersPerPx() {
  const b = state.bench;
  if (!b || !b.meters || b.pts.length < 2) return null;
  const px = polyLen(b.pts);
  return px > 0 ? b.meters / px : null;
}
function fmt(m) {
  if (m == null || !isFinite(m)) return "—";
  if (m >= 1000) return (m / 1000).toFixed(m >= 10000 ? 1 : 2) + " km";
  return (m >= 100 ? Math.round(m) : m.toFixed(1)) + " m";
}
const toScreen = p => [p[0] * view.s + view.tx, p[1] * view.s + view.ty];
const toImage = (x, y) => [(x - view.tx) / view.s, (y - view.ty) / view.s];

function fit() {

}

    c.fillStyle = "#fff"; c.fill();
    c.lineWidth = 3; c.strokeStyle = color; c.stroke();
    c.beginPath(); c.arc(p[0], p[1], 1.6, 0, Math.PI * 2); c.fillStyle = color; c.fill();
  });
  if (labels) {
    c.font = "600 12px " + cssVar("--f-num");
    c.textAlign = "center"; c.textBaseline = "middle";
    for (let i = 1; i < pts.length; i++) {
      const txt = labels(dist(pts[i - 1], pts[i]));
      if (!txt) continue;
      const a = sp[i - 1], b = sp[i];
      if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 46) continue;
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const w = c.measureText(txt).width + 10;
      c.fillStyle = color; c.beginPath();
      c.roundRect ? c.roundRect(mx - w / 2, my - 10, w, 20, 4) : c.rect(mx - w / 2, my - 10, w, 20);
      c.fill(); c.fillStyle = "#fff"; c.fillText(txt, mx, my + 1);
    }
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!img || !state) return;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, view.tx, view.ty, img.width * view.s, img.height * view.s);
  const mpp = metersPerPx();
  const bench = cssVar("--bench") || "#1f4fd1", route = cssVar("--route") || "#0b8f7f";
  drawPath(ctx, state.bench.pts, bench, mode === "bench",
    state.bench.meters && state.bench.pts.length === 2 ? () => fmt(state.bench.meters) : null);
  drawPath(ctx, state.route, route, mode === "route", mpp ? d => fmt(d * mpp) : null);
  updateReadout();
}

function drawLoupe(imgPt, screenX) {
  if (!img) return;
  const Z = 3 * Math.max(view.s, 0.5) * dpr; // magnification relative to image pixels
  const W = loupe.width, H = loupe.height;
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.fillStyle = cssVar("--canvas-bg"); lctx.fillRect(0, 0, W, H);
  lctx.save();
  lctx.beginPath(); lctx.arc(W / 2, H / 2, W / 2, 0, Math.PI * 2); lctx.clip();
  lctx.setTransform(Z, 0, 0, Z, W / 2 - imgPt[0] * Z, H / 2 - imgPt[1] * Z);
  lctx.drawImage(img, 0, 0);
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  // overlay current path segments in loupe space
  const toL = p => [W / 2 + (p[0] - imgPt[0]) * Z, H / 2 + (p[1] - imgPt[1]) * Z];
  const pts = mode === "bench" ? state.bench.pts : state.route;
  lctx.strokeStyle = mode === "bench" ? cssVar("--bench") : cssVar("--route");
  lctx.lineWidth = 3; lctx.beginPath();
  pts.forEach((p, i) => { const q = toL(p); i ? lctx.lineTo(q[0], q[1]) : lctx.moveTo(q[0], q[1]); });
  lctx.stroke();
  lctx.strokeStyle = "#e0115f"; lctx.lineWidth = 2;
  lctx.beginPath();
  lctx.moveTo(W / 2 - 22, H / 2); lctx.lineTo(W / 2 - 6, H / 2);
  lctx.moveTo(W / 2 + 6, H / 2); lctx.lineTo(W / 2 + 22, H / 2);
  lctx.moveTo(W / 2, H / 2 - 22); lctx.lineTo(W / 2, H / 2 - 6);
  lctx.moveTo(W / 2, H / 2 + 6); lctx.lineTo(W / 2, H / 2 + 22);
  lctx.stroke();
  lctx.restore();
  loupe.classList.toggle("right", screenX < 170);
  loupe.hidden = false;
}

/* ---------- readout / UI ---------- */
function updateReadout() {
  const mpp = metersPerPx();
  const chip = $("scaleChip");
  if (mpp) { chip.textContent = "1 px = " + (mpp < 1 ? mpp.toFixed(3) : mpp.toFixed(2)) + " m"; chip.classList.add("set"); }
  else { chip.textContent = "no benchmark"; chip.classList.remove("set"); }

  const big = $("big"), sub = $("sub"), hint = $("hint");
  if (mode === "bench") {
    const n = state.bench.pts.length;
    big.textContent = state.bench.meters ? fmt(state.bench.meters) : "—";
    sub.textContent = n < 2 ? "" : Math.round(polyLen(state.bench.pts)) + " px traced";
    hint.textContent = n === 0 ? "Tap the start of a segment you know the length of"
      : n === 1 ? "Tap the end of the segment"
      : "Drag points to adjust · enter length below";
  } else {
    const n = state.route.length;
    const len = polyLen(state.route);
    big.textContent = mpp ? (n > 1 ? fmt(len * mpp) : "0 m") : "—";
    sub.textContent = !mpp ? "Set a benchmark first" : n < 2 ? "" : (n - 1) + (n === 2 ? " segment" : " segments");
    hint.textContent = !mpp ? "Switch to Benchmark to set the scale"
      : n === 0 ? "Tap the route start" : "Tap to add turns · drag points to adjust";
  }
  $("undo").disabled = (mode === "bench" ? state.bench.pts.length : state.route.length) === 0;
  $("clear").disabled = $("undo").disabled;
  $("saveBench").disabled = state.bench.pts.length < 2;
  $("saveRoute").disabled = !mpp || state.route.length < 2;
}

function setMode(m) {
  mode = m;
  document.body.dataset.mode = m;
  $("tabBench").setAttribute("aria-pressed", m === "bench");
  $("tabRoute").setAttribute("aria-pressed", m === "route");
  $("benchControls").hidden = m !== "bench";
  $("routeControls").hidden = m !== "route";
  $("newRoute").hidden = m !== "route";
  $("savedWrap").hidden = m !== "route";
  draw();
}

function renderSaved() {
  const box = $("saved"); box.innerHTML = "";
  const mpp = metersPerPx();
  $("savedLabel").hidden = !state.saved.length;
  state.saved.forEach((r, i) => {
    const el = document.createElement("div");
    el.className = "item" + (i === state.activeSaved ? " active" : "");
    const name = document.createElement("span"); name.className = "name"; name.textContent = r.name;
    const len = document.createElement("span"); len.className = "len";
    len.textContent = mpp ? fmt(polyLen(r.pts) * mpp) : "—";
    const actions = document.createElement("span"); actions.className = "row";
    const show = document.createElement("button"); show.textContent = "Show";
    show.onclick = () => {
      state.route = r.pts.map(p => p.slice()); state.routeName = r.name; state.activeSaved = i;
      $("routeName").value = r.name; commit(); renderSaved();
    };
    const del = document.createElement("button"); del.textContent = "Delete"; del.style.color = "var(--danger)";
    del.onclick = () => {
      if (del.dataset.armed) {
        state.saved.splice(i, 1);
        if (state.activeSaved === i) state.activeSaved = -1; else if (state.activeSaved > i) state.activeSaved--;
        commit(); renderSaved();
      } else { del.dataset.armed = "1"; del.textContent = "Confirm"; setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = "Delete"; } }, 3000); }
    };
    actions.append(show, del);
    el.append(name, len, actions);
    box.append(el);
  });
}

function commit() { saveState(); draw(); }

/* ---------- pointer handling: tap = add, drag point = move, drag empty = pan, pinch = zoom ---------- */
const pointers = new Map();
let gesture = null; // {type:'tap'|'pan'|'drag'|'pinch', ...}
const HIT = 22, TAP_SLOP = 8;

function activePts() { return mode === "bench" ? state.bench.pts : state.route; }
function hitTest(x, y) {
  const pts = activePts();
  let best = -1, bd = HIT;
  pts.forEach((p, i) => { const s = toScreen(p); const d = Math.hypot(s[0] - x, s[1] - y); if (d < bd) { bd = d; best = i; } });
  return best;
}
function localXY(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

cv.addEventListener("pointerdown", e => {
  if (!img) return;
  cv.setPointerCapture(e.pointerId);
  const [x, y] = localXY(e);
  pointers.set(e.pointerId, [x, y]);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    gesture = { type: "pinch", d0: dist(a, b), s0: view.s, mid0: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], view0: { ...view } };
    loupe.hidden = true;
    return;
  }
  if (pointers.size > 2) return;
  const hit = hitTest(x, y);
  if (hit >= 0) {
    const p = activePts()[hit];
    const s = toScreen(p);
    gesture = { type: "drag", idx: hit, off: [s[0] - x, s[1] - y], moved: false, x0: x, y0: y };
    drawLoupe(p, x);
  } else {
    gesture = { type: "tap", x0: x, y0: y, view0: { ...view } };
  }
});

cv.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId) || !gesture) return;
  const [x, y] = localXY(e);
  pointers.set(e.pointerId, [x, y]);
  if (gesture.type === "pinch" && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = dist(a, b), mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const s = clampScale(gesture.s0 * d / gesture.d0);
    const ip = [(gesture.mid0[0] - gesture.view0.tx) / gesture.view0.s, (gesture.mid0[1] - gesture.view0.ty) / gesture.view0.s];
    view = { s, tx: mid[0] - ip[0] * s, ty: mid[1] - ip[1] * s };
    draw(); return;
  }
  if (gesture.type === "drag") {
    if (Math.hypot(x - gesture.x0, y - gesture.y0) > 3) gesture.moved = true;
    const p = toImage(x + gesture.off[0], y + gesture.off[1]);
    activePts()[gesture.idx] = p;
    if (mode === "route") state.activeSaved = -1;
    draw(); drawLoupe(p, x); return;
  }
  if (gesture.type === "tap" && Math.hypot(x - gesture.x0, y - gesture.y0) > TAP_SLOP) gesture.type = "pan";
  if (gesture.type === "pan") {
    view.tx = gesture.view0.tx + (x - gesture.x0);
    view.ty = gesture.view0.ty + (y - gesture.y0);
    draw();
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (!gesture) return;
  if (gesture.type === "pinch") {
    if (pointers.size === 0) gesture = null;
    else { // continue as pan with remaining finger
      const [x, y] = [...pointers.values()][0];
      gesture = { type: "pan", x0: x, y0: y, view0: { ...view } };
    }
    return;
  }
  if (gesture.type === "tap" && e.type === "pointerup") {
    const p = toImage(gesture.x0, gesture.y0);
    if (p[0] >= 0 && p[1] >= 0 && p[0] <= img.width && p[1] <= img.height) {
      if (mode === "bench") {
        if (state.bench.pts.length >= 2) state.bench.pts = [];
        state.bench.pts.push(p);
      } else { state.route.push(p); state.activeSaved = -1; }
      commit(); renderSaved();
    }
  }
  if (gesture.type === "drag") { loupe.hidden = true; commit(); renderSaved(); }
  gesture = null;
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

function clampScale(s) {
  if (!img) return s;
  const r = stage.getBoundingClientRect();
  const minS = Math.min(r.width / img.width, r.height / img.height) * 0.5;
  return Math.max(minS, Math.min(s, 12));
}
function zoomAt(factor, cx, cy) {
  const s = clampScale(view.s * factor);
  const ip = toImage(cx, cy);
  view = { s, tx: cx - ip[0] * s, ty: cy - ip[1] * s };
  draw();
}
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const [x, y] = localXY(e);
  zoomAt(Math.exp(-e.deltaY * 0.0015), x, y);
}, { passive: false });
function centerZoom(f) { const r = stage.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); }
$("zin").onclick = () => centerZoom(1.5);
$("zout").onclick = () => centerZoom(1 / 1.5);
$("zfit").onclick = fit;

/* ---------- controls ---------- */
$("tabBench").onclick = () => setMode("bench");
$("tabRoute").onclick = () => setMode("route");
$("undo").onclick = () => { activePts().pop(); if (mode === "route") state.activeSaved = -1; commit(); renderSaved(); };
$("clear").onclick = () => {
  if (mode === "bench") state.bench.pts = []; else { state.route = []; state.activeSaved = -1; }
  commit(); renderSaved();
};
$("newRoute").onclick = () => { state.route = []; state.activeSaved = -1; state.routeName = ""; $("routeName").value = ""; commit(); renderSaved(); };
$("saveBench").onclick = () => {
  const v = parseFloat(String($("benchLen").value).replace(",", "."));
  if (!(v > 0)) { $("benchLen").focus(); $("hint").textContent = "Enter the segment's real length in meters"; return; }
  state.bench.meters = v;
  commit(); renderSaved();
  setMode("route");
};
$("benchLen").addEventListener("keydown", e => { if (e.key === "Enter") $("saveBench").click(); });
$("routeName").addEventListener("input", e => { state.routeName = e.target.value; saveState(); });
$("saveRoute").onclick = () => {
  const name = $("routeName").value.trim() || "Route " + (state.saved.length + 1);
  const entry = { name, pts: state.route.map(p => p.slice()) };
  if (state.activeSaved >= 0 && state.saved[state.activeSaved] && state.saved[state.activeSaved].name === name) state.saved[state.activeSaved] = entry;
  else { state.saved.push(entry); state.activeSaved = state.saved.length - 1; }
  $("routeName").value = name; state.routeName = name;
  commit(); renderSaved();
  $("hint").textContent = "Saved “" + name + "”";
};

$("file").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  $("hint").textContent = "Loading photo…";
  try {
    const raw = await readAsDataURL(f);
    e.target.value = ""; // reset only after reading, so picking the same file again still fires
    const src = await shrink(await loadImg(raw));
    img = await loadImg(src);
    state = { isSample: false, bench: { pts: [], meters: null }, route: [], routeName: "", saved: [], activeSaved: -1 };
    $("benchLen").value = ""; $("routeName").value = "";
    saveState(); putImage(src); // storage is best-effort, never blocks the UI
    renderSaved(); fit(); setMode("bench");
  } catch (err) {
    $("hint").textContent = "That file could not be opened as an image (" + (err && err.message || "unknown error") + ")";
  }
});
function readAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error || new Error("read failed"));
    r.readAsDataURL(file);
  });
}
// Phone photos are often 12+ MP; scale to max 2400px so drawing and storage stay fast.
function shrink(im) {
  const MAX = 2400, k = Math.min(1, MAX / Math.max(im.width, im.height));
  const c = document.createElement("canvas");
  c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  try { return c.toDataURL("image/jpeg", 0.85); } catch (e) { return im.src; }
}

/* ---------- boot ---------- */
function loadImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
async function boot() {
  const saved = loadState();
  const stored = saved && !saved.isSample
    ? await Promise.race([getImage(), new Promise(r => setTimeout(() => r(null), 1500))]) : null;
  if (typeof stored === "string") {
    try { img = await loadImg(stored); state = saved; } catch (e) { img = null; }
  }
  if (!img) {
    img = await loadImg(SAMPLE_SRC);
    state = saved && saved.isSample ? saved : JSON.parse(JSON.stringify(SAMPLE_STATE));
  }
  $("benchLen").value = state.bench.meters || "";
  $("routeName").value = state.routeName || "";
  renderSaved();
  resize(); fit();
  setMode(metersPerPx() ? "route" : "bench");
}
new ResizeObserver(() => { resize(); }).observe(stage);
boot();
})();
</script>
</body>
</html>
